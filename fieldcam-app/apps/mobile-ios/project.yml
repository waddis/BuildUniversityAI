name: FieldCam
options:
  bundleIdPrefix: app.fieldcam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  FieldCam:
    type: application
    platform: iOS
    sources:
      - path: FieldCam
        type: group
    info:
      path: FieldCam/Info.plist
      properties:
        CFBundleDisplayName: fieldcam
        CFBundleName: FieldCam
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "fieldcam needs camera access to capture project photos and videos."
        NSPhotoLibraryUsageDescription: "fieldcam needs photo library access to import existing photos."
        NSLocationWhenInUseUsageDescription: "fieldcam records GPS coordinates with your photos for accurate project documentation."
        NSMicrophoneUsageDescription: "fieldcam needs microphone access to record video with audio."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        INFOPLIST_FILE: FieldCam/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.fieldcam.FieldCam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
